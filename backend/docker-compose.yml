version: "3.8"

# ============================================================================
# TNE Platform - Development Docker Compose
# ============================================================================
# Usage:
#   docker compose up                    - Start all core services
#   docker compose --profile redis up    - Start with Redis cache
#   docker compose --profile kafka up    - Start with Kafka messaging
#   docker compose --profile frontend up - Start with frontend
# ============================================================================

services:
  # ==========================================================================
  # INFRASTRUCTURE
  # ==========================================================================

  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: tne-postgres-dev
    environment:
      POSTGRES_DB: ${DB_NAME:-tne_website}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - tne-network

  # Redis Cache (Optional)
  redis:
    image: redis:7-alpine
    container_name: tne-redis-dev
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - tne-network
    profiles:
      - redis
      - full

  # Zookeeper (Required for Kafka)
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: tne-zookeeper-dev
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    networks:
      - tne-network
    profiles:
      - kafka
      - full

  # Kafka Message Broker (Optional)
  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: tne-kafka-dev
    depends_on:
      - zookeeper
    ports:
      - "${KAFKA_PORT:-9092}:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    networks:
      - tne-network
    profiles:
      - kafka
      - full

  # ==========================================================================
  # CORE SERVICES
  # ==========================================================================

  # Auth Service - Authentication & Authorization
  auth-service:
    build:
      context: ./auth-service
      dockerfile: Dockerfile
    container_name: tne-auth-dev
    environment:
      NODE_ENV: development
      PORT: 3001
      DATABASE_URL: postgresql://${DB_USER:-postgres}:${DB_PASSWORD:-postgres}@postgres:5432/${DB_NAME:-tne_website}
      JWT_SECRET: ${JWT_SECRET:-dev-secret-key-change-in-production}
      JWT_ACCESS_EXPIRATION: ${JWT_ACCESS_EXPIRATION:-15m}
      JWT_REFRESH_EXPIRATION_DAYS: ${JWT_REFRESH_EXPIRATION_DAYS:-7}
      SMTP_HOST: ${SMTP_HOST:-smtp.gmail.com}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASS: ${SMTP_PASSWORD}
      SMTP_FROM: ${SMTP_FROM:-Trip & Event <noreply@tripandevent.com>}
      USER_SERVICE_URL: http://user-service:3002
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:5173}
      LOG_LEVEL: ${LOG_LEVEL:-debug}
    ports:
      - "3001:3001"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - tne-network
    restart: unless-stopped

  # User Service - User Profiles, Preferences, Social Features
  user-service:
    build:
      context: ./user-service
      dockerfile: Dockerfile
    container_name: tne-user-dev
    environment:
      NODE_ENV: development
      PORT: 3002
      DATABASE_URL: postgresql://${DB_USER:-postgres}:${DB_PASSWORD:-postgres}@postgres:5432/${DB_NAME:-tne_website}
      JWT_SECRET: ${JWT_SECRET:-dev-secret-key-change-in-production}
      AUTH_SERVICE_URL: http://auth-service:3001
      GROUP_SERVICE_URL: http://group-service:3006
      NOTIFICATION_SERVICE_URL: http://notification-service:3007
      LOG_LEVEL: ${LOG_LEVEL:-debug}
    ports:
      - "3002:3002"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3002/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - tne-network
    restart: unless-stopped

  # Booking Service - Trip, Hotel, Flight, Event Bookings
  booking-service:
    build:
      context: ./booking-service
      dockerfile: Dockerfile
    container_name: tne-booking-dev
    environment:
      NODE_ENV: development
      PORT: 3004
      DATABASE_URL: postgresql://${DB_USER:-postgres}:${DB_PASSWORD:-postgres}@postgres:5432/${DB_NAME:-tne_website}
      JWT_SECRET: ${JWT_SECRET:-dev-secret-key-change-in-production}
      PAYMENT_SERVICE_URL: http://payment-service:3005
      NOTIFICATION_SERVICE_URL: http://notification-service:3007
      LOG_LEVEL: ${LOG_LEVEL:-debug}
    ports:
      - "3004:3004"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3004/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - tne-network
    restart: unless-stopped

  # Payment Service - Razorpay Integration
  payment-service:
    build:
      context: ./payment-service
      dockerfile: Dockerfile
    container_name: tne-payment-dev
    environment:
      NODE_ENV: development
      PORT: 3005
      DATABASE_URL: postgresql://${DB_USER:-postgres}:${DB_PASSWORD:-postgres}@postgres:5432/${DB_NAME:-tne_website}
      JWT_SECRET: ${JWT_SECRET:-dev-secret-key-change-in-production}
      RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID}
      RAZORPAY_KEY_SECRET: ${RAZORPAY_KEY_SECRET}
      RAZORPAY_WEBHOOK_SECRET: ${RAZORPAY_WEBHOOK_SECRET}
      BOOKING_SERVICE_URL: http://booking-service:3004
      NOTIFICATION_SERVICE_URL: http://notification-service:3007
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:5173}
      LOG_LEVEL: ${LOG_LEVEL:-debug}
    ports:
      - "3005:3005"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3005/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - tne-network
    restart: unless-stopped

  # ==========================================================================
  # TRAVELLERS FEATURE SERVICES
  # ==========================================================================

  # Group Service - Trip Groups, Itineraries, Expenses, Polls
  group-service:
    build:
      context: ./group-service
      dockerfile: Dockerfile
    container_name: tne-group-dev
    environment:
      NODE_ENV: development
      PORT: 3006
      DATABASE_URL: postgresql://${DB_USER:-postgres}:${DB_PASSWORD:-postgres}@postgres:5432/${DB_NAME:-tne_website}
      JWT_SECRET: ${JWT_SECRET:-dev-secret-key-change-in-production}
      USER_SERVICE_URL: http://user-service:3002
      CHAT_SERVICE_URL: http://chat-service:3008
      BOOKING_SERVICE_URL: http://booking-service:3004
      NOTIFICATION_SERVICE_URL: http://notification-service:3007
      LOG_LEVEL: ${LOG_LEVEL:-debug}
    ports:
      - "3006:3006"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3006/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - tne-network
    restart: unless-stopped

  # Notification Service - Email, SMS, Push, In-App Notifications
  notification-service:
    build:
      context: ./notification-service
      dockerfile: Dockerfile
    container_name: tne-notification-dev
    environment:
      NODE_ENV: development
      PORT: 3007
      DATABASE_URL: postgresql://${DB_USER:-postgres}:${DB_PASSWORD:-postgres}@postgres:5432/${DB_NAME:-tne_website}
      JWT_SECRET: ${JWT_SECRET:-dev-secret-key-change-in-production}
      # Email (SMTP)
      SMTP_HOST: ${SMTP_HOST:-smtp.gmail.com}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASS: ${SMTP_PASSWORD}
      SMTP_FROM: ${SMTP_FROM:-Trip & Event <noreply@tripandevent.com>}
      # SMS (Twilio)
      TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID}
      TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN}
      TWILIO_PHONE_NUMBER: ${TWILIO_PHONE_NUMBER}
      # Push (Firebase)
      FIREBASE_PROJECT_ID: ${FIREBASE_PROJECT_ID}
      FIREBASE_PRIVATE_KEY: ${FIREBASE_PRIVATE_KEY}
      FIREBASE_CLIENT_EMAIL: ${FIREBASE_CLIENT_EMAIL}
      # Kafka (Optional)
      KAFKA_ENABLED: ${KAFKA_ENABLED:-false}
      KAFKA_BROKERS: kafka:29092
      LOG_LEVEL: ${LOG_LEVEL:-debug}
    ports:
      - "3007:3007"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3007/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - tne-network
    restart: unless-stopped

  # Chat Service - Real-time Messaging with WebSocket
  chat-service:
    build:
      context: ./chat-service
      dockerfile: Dockerfile
    container_name: tne-chat-dev
    environment:
      NODE_ENV: development
      PORT: 3008
      DATABASE_URL: postgresql://${DB_USER:-postgres}:${DB_PASSWORD:-postgres}@postgres:5432/${DB_NAME:-tne_website}
      JWT_SECRET: ${JWT_SECRET:-dev-secret-key-change-in-production}
      USER_SERVICE_URL: http://user-service:3002
      GROUP_SERVICE_URL: http://group-service:3006
      NOTIFICATION_SERVICE_URL: http://notification-service:3007
      # Redis for WebSocket scaling (optional in dev)
      REDIS_URL: redis://redis:6379
      LOG_LEVEL: ${LOG_LEVEL:-debug}
    ports:
      - "3008:3008"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3008/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - tne-network
    restart: unless-stopped

  # CRMSync Service - Admin Dashboard, Analytics
  crmsync-service:
    build:
      context: ./crmsync-service
      dockerfile: Dockerfile
    container_name: tne-crmsync-dev
    environment:
      NODE_ENV: development
      PORT: 3011
      DATABASE_URL: postgresql://${DB_USER:-postgres}:${DB_PASSWORD:-postgres}@postgres:5432/${DB_NAME:-tne_website}
      JWT_SECRET: ${JWT_SECRET:-dev-secret-key-change-in-production}
      AUTH_SERVICE_URL: http://auth-service:3001
      USER_SERVICE_URL: http://user-service:3002
      BOOKING_SERVICE_URL: http://booking-service:3004
      PAYMENT_SERVICE_URL: http://payment-service:3005
      GROUP_SERVICE_URL: http://group-service:3006
      LOG_LEVEL: ${LOG_LEVEL:-debug}
    ports:
      - "3011:3011"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3011/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - tne-network
    restart: unless-stopped

  # ==========================================================================
  # API GATEWAY
  # ==========================================================================

  api-gateway:
    build:
      context: ./api-gateway
      dockerfile: Dockerfile
    container_name: tne-gateway-dev
    environment:
      NODE_ENV: development
      PORT: 5000
      JWT_SECRET: ${JWT_SECRET:-dev-secret-key-change-in-production}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:5173}
      # Service URLs
      AUTH_SERVICE_URL: http://auth-service:3001
      USER_SERVICE_URL: http://user-service:3002
      BOOKING_SERVICE_URL: http://booking-service:3004
      PAYMENT_SERVICE_URL: http://payment-service:3005
      GROUP_SERVICE_URL: http://group-service:3006
      NOTIFICATION_SERVICE_URL: http://notification-service:3007
      CHAT_SERVICE_URL: http://chat-service:3008
      CRMSYNC_SERVICE_URL: http://crmsync-service:3011
      # Gateway Settings
      UPSTREAM_TIMEOUT_MS: ${UPSTREAM_TIMEOUT_MS:-15000}
      UPSTREAM_RETRY: ${UPSTREAM_RETRY:-2}
      CIRCUIT_ERROR_THRESHOLD: ${CIRCUIT_ERROR_THRESHOLD:-50}
      CIRCUIT_RESET_TIMEOUT_MS: ${CIRCUIT_RESET_TIMEOUT_MS:-30000}
      LOG_LEVEL: ${LOG_LEVEL:-debug}
    ports:
      - "5000:5000"
    depends_on:
      - auth-service
      - user-service
      - booking-service
      - payment-service
      - group-service
      - notification-service
      - chat-service
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - tne-network
    restart: unless-stopped

  # ==========================================================================
  # FRONTEND (Optional Profile)
  # ==========================================================================

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:5000}
    container_name: tne-frontend-dev
    ports:
      - "${FRONTEND_PORT:-80}:80"
    depends_on:
      - api-gateway
    networks:
      - tne-network
    restart: unless-stopped
    profiles:
      - frontend
      - full

# ============================================================================
# VOLUMES
# ============================================================================
volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

# ============================================================================
# NETWORKS
# ============================================================================
networks:
  tne-network:
    driver: bridge
