version: "3.8"

# ============================================================================
# TNE Platform - Production Docker Compose
# ============================================================================
# Usage:
#   docker compose -f docker-compose.production.yml up -d
#   docker compose -f docker-compose.production.yml --profile monitoring up -d
# ============================================================================
# IMPORTANT:
#   - All secrets MUST be provided via environment variables
#   - Database ports are NOT exposed externally
#   - All services have health checks and restart policies
# ============================================================================

services:
  # ==========================================================================
  # INFRASTRUCTURE
  # ==========================================================================

  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: tne-postgres-prod
    restart: always
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - tne-internal
    deploy:
      resources:
        limits:
          memory: 2G
        reservations:
          memory: 512M

  # Redis Cache & Session Store
  redis:
    image: redis:7-alpine
    container_name: tne-redis-prod
    restart: always
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD}
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - tne-internal
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 128M

  # Zookeeper (Required for Kafka)
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: tne-zookeeper-prod
    restart: always
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
      ZOOKEEPER_SYNC_LIMIT: 2
    volumes:
      - zookeeper_data:/var/lib/zookeeper/data
      - zookeeper_log:/var/lib/zookeeper/log
    healthcheck:
      test: ["CMD-SHELL", "echo ruok | nc localhost 2181 | grep imok"]
      interval: 30s
      timeout: 10s
      retries: 5
    networks:
      - tne-internal
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M

  # Kafka Message Broker
  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: tne-kafka-prod
    restart: always
    depends_on:
      zookeeper:
        condition: service_healthy
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_LOG_RETENTION_HOURS: 168
      KAFKA_LOG_RETENTION_BYTES: 1073741824
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "kafka-broker-api-versions --bootstrap-server localhost:29092"]
      interval: 30s
      timeout: 10s
      retries: 5
    networks:
      - tne-internal
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 512M

  # ==========================================================================
  # CORE SERVICES
  # ==========================================================================

  # Auth Service - Authentication & Authorization
  auth-service:
    image: ${DOCKER_REGISTRY:-ghcr.io}/tne/auth-service:${IMAGE_TAG:-latest}
    build:
      context: ./auth-service
      dockerfile: Dockerfile
    container_name: tne-auth-prod
    restart: always
    environment:
      NODE_ENV: production
      PORT: 3001
      DATABASE_URL: postgresql://${DB_USER}:${DB_PASSWORD}@postgres:5432/${DB_NAME}
      JWT_SECRET: ${JWT_SECRET}
      JWT_ACCESS_EXPIRATION: ${JWT_ACCESS_EXPIRATION:-15m}
      JWT_REFRESH_EXPIRATION_DAYS: ${JWT_REFRESH_EXPIRATION_DAYS:-7}
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASS: ${SMTP_PASS}
      SMTP_FROM: ${SMTP_FROM}
      USER_SERVICE_URL: http://user-service:3002
      FRONTEND_URL: ${FRONTEND_URL}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - tne-internal
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M

  # User Service - User Profiles, Preferences, Social Features
  user-service:
    image: ${DOCKER_REGISTRY:-ghcr.io}/tne/user-service:${IMAGE_TAG:-latest}
    build:
      context: ./user-service
      dockerfile: Dockerfile
    container_name: tne-user-prod
    restart: always
    environment:
      NODE_ENV: production
      PORT: 3002
      DATABASE_URL: postgresql://${DB_USER}:${DB_PASSWORD}@postgres:5432/${DB_NAME}
      JWT_SECRET: ${JWT_SECRET}
      AUTH_SERVICE_URL: http://auth-service:3001
      GROUP_SERVICE_URL: http://group-service:3006
      NOTIFICATION_SERVICE_URL: http://notification-service:3007
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      LOG_LEVEL: ${LOG_LEVEL:-info}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3002/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - tne-internal
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M

  # Booking Service - Trip, Hotel, Flight, Event Bookings
  booking-service:
    image: ${DOCKER_REGISTRY:-ghcr.io}/tne/booking-service:${IMAGE_TAG:-latest}
    build:
      context: ./booking-service
      dockerfile: Dockerfile
    container_name: tne-booking-prod
    restart: always
    environment:
      NODE_ENV: production
      PORT: 3004
      DATABASE_URL: postgresql://${DB_USER}:${DB_PASSWORD}@postgres:5432/${DB_NAME}
      JWT_SECRET: ${JWT_SECRET}
      PAYMENT_SERVICE_URL: http://payment-service:3005
      NOTIFICATION_SERVICE_URL: http://notification-service:3007
      KAFKA_BROKERS: kafka:29092
      KAFKA_ENABLED: "true"
      LOG_LEVEL: ${LOG_LEVEL:-info}
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3004/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - tne-internal
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M

  # Payment Service - Razorpay Integration
  payment-service:
    image: ${DOCKER_REGISTRY:-ghcr.io}/tne/payment-service:${IMAGE_TAG:-latest}
    build:
      context: ./payment-service
      dockerfile: Dockerfile
    container_name: tne-payment-prod
    restart: always
    environment:
      NODE_ENV: production
      PORT: 3005
      DATABASE_URL: postgresql://${DB_USER}:${DB_PASSWORD}@postgres:5432/${DB_NAME}
      JWT_SECRET: ${JWT_SECRET}
      RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID}
      RAZORPAY_KEY_SECRET: ${RAZORPAY_KEY_SECRET}
      RAZORPAY_WEBHOOK_SECRET: ${RAZORPAY_WEBHOOK_SECRET}
      BOOKING_SERVICE_URL: http://booking-service:3004
      NOTIFICATION_SERVICE_URL: http://notification-service:3007
      FRONTEND_URL: ${FRONTEND_URL}
      KAFKA_BROKERS: kafka:29092
      KAFKA_ENABLED: "true"
      LOG_LEVEL: ${LOG_LEVEL:-info}
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3005/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - tne-internal
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M

  # ==========================================================================
  # TRAVELLERS FEATURE SERVICES
  # ==========================================================================

  # Group Service - Trip Groups, Itineraries, Expenses, Polls
  group-service:
    image: ${DOCKER_REGISTRY:-ghcr.io}/tne/group-service:${IMAGE_TAG:-latest}
    build:
      context: ./group-service
      dockerfile: Dockerfile
    container_name: tne-group-prod
    restart: always
    environment:
      NODE_ENV: production
      PORT: 3006
      DATABASE_URL: postgresql://${DB_USER}:${DB_PASSWORD}@postgres:5432/${DB_NAME}
      JWT_SECRET: ${JWT_SECRET}
      USER_SERVICE_URL: http://user-service:3002
      CHAT_SERVICE_URL: http://chat-service:3008
      BOOKING_SERVICE_URL: http://booking-service:3004
      NOTIFICATION_SERVICE_URL: http://notification-service:3007
      KAFKA_BROKERS: kafka:29092
      KAFKA_ENABLED: "true"
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      LOG_LEVEL: ${LOG_LEVEL:-info}
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3006/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - tne-internal
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M

  # Notification Service - Email, SMS, Push, In-App Notifications
  notification-service:
    image: ${DOCKER_REGISTRY:-ghcr.io}/tne/notification-service:${IMAGE_TAG:-latest}
    build:
      context: ./notification-service
      dockerfile: Dockerfile
    container_name: tne-notification-prod
    restart: always
    environment:
      NODE_ENV: production
      PORT: 3007
      DATABASE_URL: postgresql://${DB_USER}:${DB_PASSWORD}@postgres:5432/${DB_NAME}
      JWT_SECRET: ${JWT_SECRET}
      # Email (SMTP)
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASS: ${SMTP_PASS}
      SMTP_FROM: ${SMTP_FROM}
      # SMS (Twilio)
      TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID}
      TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN}
      TWILIO_PHONE_NUMBER: ${TWILIO_PHONE_NUMBER}
      # Push (Firebase)
      FIREBASE_PROJECT_ID: ${FIREBASE_PROJECT_ID}
      FIREBASE_PRIVATE_KEY: ${FIREBASE_PRIVATE_KEY}
      FIREBASE_CLIENT_EMAIL: ${FIREBASE_CLIENT_EMAIL}
      # Kafka
      KAFKA_BROKERS: kafka:29092
      KAFKA_ENABLED: "true"
      KAFKA_CONSUMER_GROUP: notification-service
      # Redis
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      LOG_LEVEL: ${LOG_LEVEL:-info}
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3007/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - tne-internal
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M

  # Chat Service - Real-time Messaging with WebSocket
  chat-service:
    image: ${DOCKER_REGISTRY:-ghcr.io}/tne/chat-service:${IMAGE_TAG:-latest}
    build:
      context: ./chat-service
      dockerfile: Dockerfile
    container_name: tne-chat-prod
    restart: always
    environment:
      NODE_ENV: production
      PORT: 3008
      DATABASE_URL: postgresql://${DB_USER}:${DB_PASSWORD}@postgres:5432/${DB_NAME}
      JWT_SECRET: ${JWT_SECRET}
      USER_SERVICE_URL: http://user-service:3002
      GROUP_SERVICE_URL: http://group-service:3006
      NOTIFICATION_SERVICE_URL: http://notification-service:3007
      # Redis for WebSocket pub/sub and session storage
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      KAFKA_BROKERS: kafka:29092
      KAFKA_ENABLED: "true"
      LOG_LEVEL: ${LOG_LEVEL:-info}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3008/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - tne-internal
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 512M

  # CRMSync Service - Admin Dashboard, Analytics
  crmsync-service:
    image: ${DOCKER_REGISTRY:-ghcr.io}/tne/crmsync-service:${IMAGE_TAG:-latest}
    build:
      context: ./crmsync-service
      dockerfile: Dockerfile
    container_name: tne-crmsync-prod
    restart: always
    environment:
      NODE_ENV: production
      PORT: 3011
      DATABASE_URL: postgresql://${DB_USER}:${DB_PASSWORD}@postgres:5432/${DB_NAME}
      JWT_SECRET: ${JWT_SECRET}
      AUTH_SERVICE_URL: http://auth-service:3001
      USER_SERVICE_URL: http://user-service:3002
      BOOKING_SERVICE_URL: http://booking-service:3004
      PAYMENT_SERVICE_URL: http://payment-service:3005
      GROUP_SERVICE_URL: http://group-service:3006
      NOTIFICATION_SERVICE_URL: http://notification-service:3007
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      LOG_LEVEL: ${LOG_LEVEL:-info}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3011/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - tne-internal
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M

  # ==========================================================================
  # API GATEWAY
  # ==========================================================================

  api-gateway:
    image: ${DOCKER_REGISTRY:-ghcr.io}/tne/api-gateway:${IMAGE_TAG:-latest}
    build:
      context: ./api-gateway
      dockerfile: Dockerfile
    container_name: tne-gateway-prod
    restart: always
    environment:
      NODE_ENV: production
      PORT: 5000
      JWT_SECRET: ${JWT_SECRET}
      FRONTEND_URL: ${FRONTEND_URL}
      # Service URLs
      AUTH_SERVICE_URL: http://auth-service:3001
      USER_SERVICE_URL: http://user-service:3002
      BOOKING_SERVICE_URL: http://booking-service:3004
      PAYMENT_SERVICE_URL: http://payment-service:3005
      GROUP_SERVICE_URL: http://group-service:3006
      NOTIFICATION_SERVICE_URL: http://notification-service:3007
      CHAT_SERVICE_URL: http://chat-service:3008
      CRMSYNC_SERVICE_URL: http://crmsync-service:3011
      # Gateway Settings
      UPSTREAM_TIMEOUT_MS: ${UPSTREAM_TIMEOUT_MS:-30000}
      UPSTREAM_RETRY: ${UPSTREAM_RETRY:-3}
      CIRCUIT_ERROR_THRESHOLD: ${CIRCUIT_ERROR_THRESHOLD:-50}
      CIRCUIT_RESET_TIMEOUT_MS: ${CIRCUIT_RESET_TIMEOUT_MS:-30000}
      # Rate Limiting
      RATE_LIMIT_WINDOW_MS: ${RATE_LIMIT_WINDOW_MS:-60000}
      RATE_LIMIT_MAX_REQUESTS: ${RATE_LIMIT_MAX_REQUESTS:-100}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    ports:
      - "${GATEWAY_PORT:-5000}:5000"
    depends_on:
      - auth-service
      - user-service
      - booking-service
      - payment-service
      - group-service
      - notification-service
      - chat-service
      - crmsync-service
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - tne-internal
      - tne-external
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M

  # ==========================================================================
  # FRONTEND
  # ==========================================================================

  frontend:
    image: ${DOCKER_REGISTRY:-ghcr.io}/tne/frontend:${IMAGE_TAG:-latest}
    build:
      context: ../frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL}
        VITE_RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID}
    container_name: tne-frontend-prod
    restart: always
    ports:
      - "${FRONTEND_PORT:-80}:80"
      - "${FRONTEND_SSL_PORT:-443}:443"
    volumes:
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api-gateway
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:80/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - tne-external
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 128M

  # ==========================================================================
  # MONITORING (Optional Profile)
  # ==========================================================================

  # Prometheus - Metrics Collection
  prometheus:
    image: prom/prometheus:v2.47.0
    container_name: tne-prometheus-prod
    restart: always
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.enable-lifecycle'
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:9090/-/healthy"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - tne-internal
    profiles:
      - monitoring

  # Grafana - Metrics Visualization
  grafana:
    image: grafana/grafana:10.2.0
    container_name: tne-grafana-prod
    restart: always
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    depends_on:
      - prometheus
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - tne-internal
      - tne-external
    profiles:
      - monitoring

# ============================================================================
# VOLUMES
# ============================================================================
volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  kafka_data:
    driver: local
  zookeeper_data:
    driver: local
  zookeeper_log:
    driver: local
  prometheus_data:
    driver: local
  grafana_data:
    driver: local

# ============================================================================
# NETWORKS
# ============================================================================
networks:
  tne-internal:
    driver: bridge
    internal: true
  tne-external:
    driver: bridge
services:

  # --------------------
  # Infrastructure
  # --------------------

  postgres:
    image: postgres:15-alpine
    container_name: tne_postgres
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  redis:
    image: redis:7-alpine
    container_name: tne_redis
    restart: always
    command: redis-server --requirepass ${REDIS_PASSWORD}
    ports:
      - "6379:6379"

  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: tne_zookeeper
    restart: always
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: tne_kafka
    restart: always
    depends_on:
      - zookeeper
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1

  # --------------------
  # Core API Gateway
  # --------------------

  api-gateway:
    image: ghcr.io/tne/api-gateway:latest
    build:
      context: .
      dockerfile: api-gateway/Dockerfile
    container_name: tne_api_gateway
    restart: always
    env_file: .env
    ports:
      - "5000:5000"
    depends_on:
      - redis
      - kafka
      - postgres

  # --------------------
  # Auth Service
  # --------------------

  auth-service:
    image: ghcr.io/tne/auth-service:latest
    build:
      context: .
      dockerfile: auth-service/Dockerfile
    container_name: tne_auth_service
    restart: always
    env_file: .env
    depends_on:
      - postgres
      - redis

  # --------------------
  # User Service
  # --------------------

  user-service:
    image: ghcr.io/tne/user-service:latest
    build:
      context: .
      dockerfile: user-service/Dockerfile
    container_name: tne_user_service
    restart: always
    env_file: .env
    depends_on:
      - postgres
      - redis

  # --------------------
  # Booking Service
  # --------------------

  booking-service:
    image: ghcr.io/tne/booking-service:latest
    build:
      context: .
      dockerfile: booking-service/Dockerfile
    container_name: tne_booking_service
    restart: always
    env_file: .env
    depends_on:
      - postgres
      - kafka

  # --------------------
  # Payment Service
  # --------------------

  payment-service:
    image: ghcr.io/tne/payment-service:latest
