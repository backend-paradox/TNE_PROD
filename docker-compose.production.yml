services:
  postgres:
    image: postgres:15-alpine
    container_name: tne_postgres
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: tne_redis
    restart: always
    ports:
      - "6379:6379"

  auth-service:
    build:
      context: ./backend
      dockerfile: auth-service/Dockerfile
    container_name: tne_auth_service
    env_file: .env
    depends_on:
      - postgres
      - redis
    ports:
      - "3001:3001"

  user-service:
    build:
      context: ./backend
      dockerfile: user-service/Dockerfile
    container_name: tne_user_service
    env_file: .env
    depends_on:
      - postgres
      - redis
    ports:
      - "3002:3002"

  booking-service:
    build:
      context: ./backend
      dockerfile: booking-service/Dockerfile
    container_name: tne_booking_service
    env_file: .env
    depends_on:
      - postgres
      - redis
    ports:
      - "3004:3004"

  payment-service:
    build:
      context: ./backend
      dockerfile: payment-service/Dockerfile
    container_name: tne_payment_service
    env_file: .env
    depends_on:
      - postgres
    ports:
      - "3005:3005"

  group-service:
    build:
      context: ./backend
      dockerfile: group-service/Dockerfile
    container_name: tne_group_service
    env_file: .env
    depends_on:
      - postgres
    ports:
      - "3008:3008"

  chat-service:
    build:
      context: ./backend
      dockerfile: chat-service/Dockerfile
    container_name: tne_chat_service
    env_file: .env
    depends_on:
      - postgres
      - redis
    ports:
      - "3009:3009"

  notification-service:
    build:
      context: ./backend
      dockerfile: notification-service/Dockerfile
    container_name: tne_notification_service
    env_file: .env
    depends_on:
      - postgres
      - redis
    ports:
      - "3007:3007"

  crmsync-service:
    build:
      context: ./backend
      dockerfile: crmsync-service/Dockerfile
    container_name: tne_crmsync_service
    env_file: .env
    depends_on:
      - postgres
    ports:
      - "3011:3011"

  api-gateway:
    build:
      context: ./backend
      dockerfile: api-gateway/Dockerfile
    container_name: tne_api_gateway
    env_file: .env
    depends_on:
      - auth-service
      - user-service
      - booking-service
    ports:
      - "5000:5000"

  frontend:
    build: ./frontend
    container_name: tne_frontend
    ports:
      - "80:80"
    depends_on:
      - api-gateway

volumes:
  postgres_data:
